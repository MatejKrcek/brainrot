name: GrayMatter
options:
  bundleIdPrefix: com.matejkrcek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: HRZTF76M9G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targetTemplates:
  Extension:
    type: app-extension
    platform: iOS
    settings:
      base:
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AppBase:
    type: application
    platform: iOS
    sources:
      - path: GrayMatter
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
      - SharedScreenTime
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault

targets:
  GrayMatter:
    templates: [AppBase]
    dependencies:
      - target: GrayMatterWidget
      - target: GrayMatterMonitor
      - target: GrayMatterReport
      - target: GrayMatterShield
      - target: GrayMatterShieldAction
    info:
      path: GrayMatter/Info.plist
      properties: &appInfo
        CFBundleDisplayName: Brain Health
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.matejkrcek.graymatter
            CFBundleURLSchemes: [graymatter]
    entitlements:
      path: GrayMatter/GrayMatter.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatter

  GrayMatterWidget:
    templates: [Extension]
    sources:
      - path: GrayMatterWidget
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
    info:
      path: GrayMatterWidget/Info.plist
      properties:
        CFBundleDisplayName: Brain Health
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GrayMatterWidget/GrayMatterWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatter.widget

  GrayMatterMonitor:
    templates: [Extension]
    sources:
      - path: GrayMatterMonitor
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
      - SharedScreenTime
    info:
      path: GrayMatterMonitor/Info.plist
      properties:
        CFBundleDisplayName: Brain Health Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: GrayMatterMonitor/GrayMatterMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatter.monitor

  GrayMatterReport:
    templates: [Extension]
    sources:
      - path: GrayMatterReport
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
    info:
      path: GrayMatterReport/Info.plist
      properties:
        CFBundleDisplayName: Brain Health Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: GrayMatterReport/GrayMatterReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatter.report

  GrayMatterShield:
    templates: [Extension]
    sources:
      - path: GrayMatterShield
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
    info:
      path: GrayMatterShield/Info.plist
      properties:
        CFBundleDisplayName: Brain Health Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: GrayMatterShield/GrayMatterShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatter.shield

  GrayMatterShieldAction:
    templates: [Extension]
    sources:
      - path: GrayMatterShieldAction
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
    info:
      path: GrayMatterShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Brain Health Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: GrayMatterShieldAction/GrayMatterShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatter.shieldaction

  # ---------------------------------------------------------------------------
  # Lite: identical code, NO Family Controls entitlement and no Screen Time
  # extensions → installs on a free Personal Team. Runs in demo mode + widget.
  # ---------------------------------------------------------------------------
  GrayMatterLite:
    templates: [AppBase]
    dependencies:
      - target: GrayMatterLiteWidget
    info:
      path: GrayMatter/Info-Lite.plist
      properties: *appInfo
    entitlements:
      path: GrayMatter/GrayMatterLite.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatterlite
        PRODUCT_NAME: GrayMatterLite

  GrayMatterLiteWidget:
    templates: [Extension]
    sources:
      - path: GrayMatterWidget
        excludes: ["Info*.plist", "*.entitlements"]
      - Shared
    info:
      path: GrayMatterWidget/Info-Lite.plist
      properties:
        CFBundleDisplayName: Brain Health
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GrayMatterWidget/GrayMatterLiteWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matejkrcek.graymatter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matejkrcek.graymatterlite.widget

schemes:
  GrayMatter:
    build:
      targets:
        GrayMatter: all
    run:
      config: Debug
    archive:
      config: Release
  GrayMatterLite:
    build:
      targets:
        GrayMatterLite: all
    run:
      config: Debug
    archive:
      config: Release
